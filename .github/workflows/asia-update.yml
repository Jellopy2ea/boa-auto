name: Asia Price Update - 28 Cards

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  scrape-asia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm install || true
          npm install node-fetch@2 || true

      - name: Run asia scraper
        run: |
          node asia-scraper.js
          echo "=== asia-prices.json ==="
          cat asia-prices.json
          ls -lh

      - name: Install AWS CLI for R2
        run: |
          pip install awscli --quiet || pip3 install awscli --quiet

      - name: Upload to R2 - asia-prices.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: cardmatem-raw
        run: |
          aws s3 cp ./asia-prices.json s3://$R2_BUCKET/asia-prices.json --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com --content-type application/json
          echo "Uploaded asia-prices.json to R2"
          aws s3 ls s3://$R2_BUCKET/ --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com | grep asia
