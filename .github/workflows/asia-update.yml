name: Asia Price Update - 28 Cards

on:
  schedule:
    - cron: '15 * * * *'  # รันทุกชั่วโมงนาทีที่ 15  (ห่างจาก boa 15 นาที กันชน)
  workflow_dispatch:

jobs:
  scrape-asia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: |
          npm install || true
          npm install node-fetch@2 || true

      - name: Run asia scraper
        run: |
          node asia-scraper.js
          cat asia-prices.json
          ls -lh

      - name: Upload to R2 - asia-prices.json
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: cardmatem-raw
          source-dir: ./
          destination-dir: ./
          files: asia-prices.json

      # ถ้าใช้ wrangler แบบ boa เดิม ให้ใช้บล็อกนี้แทนด้านบน
