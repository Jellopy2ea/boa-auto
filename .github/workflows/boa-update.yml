name: Boa Price

on:
  schedule:
    - cron: '05 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure ESM
        run: |
          if [ ! -f package.json ]; then echo '{"type":"module"}' > package.json; fi
          cat package.json
          ls -la
      - run: npm install playwright @aws-sdk/client-s3
      - run: npx playwright install chromium --with-deps
      - name: Run Boa scraper 57 cards
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ls -la
          node boa-scraper.js
